# pytest configuration for services/genai.

[pytest]
# Discover tests in the tests/ directory
testpaths = tests

# asyncio mode for async test functions
asyncio_mode = auto

# Verbose output
addopts = -v --tb=short

# Treat warnings as non-fatal (some pydantic v2 compat warnings)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
